version: 2
updates:
  # Monitor all npm package.json files
  - package-ecosystem: "npm"
    directories:
      - "/**"
    schedule:
      interval: "daily"
    allow:
      - dependency-type: "all"

  # Monitor all GitHub Actions workflow files (.github/workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "hourly"
